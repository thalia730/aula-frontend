<!DOCTYPE html>
<html lang="pt-br">
<head>
    <h1>Botão Interativo</h1>
    <p>Este é o meu primeiro site.</p>
    <title>Botão Interativo</title>
    <style>
        .meu-botao {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .meu-botao:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <button class="meu-botao" onclick="mostrarMensagem()">
        Clique Aqui!
    </button>
     <button class="meu-botao3" onclick="mostrarMensagem()">
        Clique Aqui!
    </button>
     <button class="meu-botao2" onclick="mostrarMensagem()">
        Clique Aqui!
    </button>

    <script>
        function mostrarMensagem() {
            alert("Olá, mundo!");
        }
    </script>
    <h1>Botão Interativo</h1>
    <p>Este é o meu primeiro site.</p>
</body>
</html>
